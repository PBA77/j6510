[platformio]
src_dir = examples/j6510_benchmark
default_envs = teensy40-benchmark

[env:teensy40-benchmark]
platform = teensy
board = teensy40
framework = arduino
monitor_speed = 115200
build_unflags =
    -std=gnu++11
    -std=gnu++14
build_flags =
    -std=gnu++17
    -DJ6510_ENABLE_BLOCK_CACHE=1

[env:rp2040-pico-benchmark]
platform = raspberrypi
board = pico
framework = arduino
monitor_speed = 115200
build_flags =
    -DJ6510_ENABLE_BLOCK_CACHE=1

[env:esp32s2-saola-benchmark]
platform = espressif32
board = esp32-s2-saola-1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-210
monitor_port = /dev/cu.usbserial-210
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -DJ6510_ENABLE_BLOCK_CACHE=1
    -DBOARD_HAS_PSRAM
